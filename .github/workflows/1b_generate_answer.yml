name: 1B. Generate Answer

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["1A. Search Post to Answer"]
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-automation:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Configure Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Pull Latest Changes (Maintain Persistence)
      run: |
        git pull origin ${GITHUB_REF_NAME} --rebase

    - name: Install and Start Cloudflare WARP (TUN Global Mode)
      run: |
        curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list

        sudo apt-get update && sudo apt-get install -y cloudflare-warp

        sudo systemctl start warp-svc
        sleep 2

        warp-cli --accept-tos registration new || warp-cli registration new

        warp-cli --accept-tos mode warp || warp-cli mode warp

        warp-cli --accept-tos connect || warp-cli connect
        sleep 5

        curl https://cloudflare.com/cdn-cgi/trace

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Run Script
      env:
        DECRYPT_KEY: ${{ secrets.DECRYPT_KEY }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python generate_answer.py

    - name: Upload Error Screenshot
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: chatgpt-generate-error-screenshot
        path: error/error_screenshot.png
        if-no-files-found: ignore
        retention-days: 3

    - name: Commit and Push Changes (If updated)
      if: always()
      run: |
        CHANGED=0
        for f in json/status.json json/quora_cta_state.json locators/changed_locators.json locators/chatgpt_locators.txt locators/quora_locators.txt json/config.json; do
          if [ -f "$f" ] && ! git diff --quiet -- "$f"; then CHANGED=1; fi
          if [ -f "$f" ] && [ -n "$(git ls-files --others --exclude-standard -- "$f")" ]; then CHANGED=1; fi
        done
        if [ "$CHANGED" -eq 1 ]; then
          echo "[OK] Changes detected. Stashing changes to pull latest..."
          git stash --include-untracked
          git pull origin ${GITHUB_REF_NAME} --rebase
          git stash pop || true
          echo "[OK] Staging and committing updated files..."
          git add json/status.json json/quora_cta_state.json locators/changed_locators.json locators/chatgpt_locators.txt locators/quora_locators.txt json/config.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Automated: Update answer generation state and locator/config data [skip ci]"
            git push origin ${GITHUB_REF_NAME} || (git pull origin ${GITHUB_REF_NAME} --rebase && git push origin ${GITHUB_REF_NAME})
          else
            echo "[INFO] No staged changes after stash/pop."
          fi
        else
          echo "[INFO] No changes detected. Skipping push."
        fi
